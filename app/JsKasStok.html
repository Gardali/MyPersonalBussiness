<script>
// Posetive — halaman Kas & Stok, form kas & mutasi stok.
function notaBtn(url) {
  return /^https?:\/\//.test(url || '') ? '<a class="att" href="' + esc(url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="Lihat nota">' + ikon('nota') + '</a>' : '';
}
function barisKas(k) {
  var m = k.jenis === 'Masuk', a = akunKas(k);
  if (k.jenis === JENIS_PINDAH) return item({lead: '<div class="ic">' + ikon('refresh') + '</div>', t: esc(k.keterangan || 'Pindah dana'),
    s: tgl(k.tanggal) + ' · ' + esc(labelAkun(a)) + ' → ' + esc(labelAkun(k.akun_tujuan)) + (k.id_event ? ' · ' + esc(k.id_event) : ''), end: notaBtn(k.no_nota) + '<span>⇄ ' + rp(k.nominal) + '</span>', on: "formKas('" + k.id + "')"});
  var tanda = a === AKUN_OWNER ? ' · <span class="pill">owner langsung</span>' : a === AKUN_REIMBURSE ? ' · <span class="pill p-warn">reimburse</span>' : a === AKUN_TUNAI ? ' · <span class="pill">tunai</span>' : '';
  return item({lead: '<div class="ic ' + (m ? 'in' : '') + '">' + ikon(m ? 'down' : 'up') + '</div>', t: esc(k.keterangan || k.kategori), s: tgl(k.tanggal) + ' · ' + esc(k.kategori) + (k.id_event ? ' · ' + esc(k.id_event) : '') + tanda,
    end: notaBtn(k.no_nota) + '<span class="' + (m ? 'pos' : '') + '">' + (m ? '+' : '−') + rp(k.nominal) + '</span>', on: "formKas('" + k.id + "')"});
}

function vKas() {
  var bulanList = Array.from(new Set(D.kas.map(function (k) { return String(k.tanggal).slice(0, 7); }))).sort().reverse();
  var f = FILTER.kas, sb = FILTER.kasSumber;
  var list = D.kas.filter(function (k) { return !f || String(k.tanggal).slice(0, 7) === f; })
    .filter(function (k) { return !sb || (sb === 'umum' ? !k.id_event : !!k.id_event); })
    .sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : (a.id < b.id ? 1 : -1); });
  var masuk = sum(list.filter(bukanSetoran), function (k) { return k.nominal; });
  var setoran = sum(list.filter(function (k) { return k.jenis === 'Masuk' && k.kategori === 'Setoran Owner'; }), function (k) { return k.nominal; });
  var keluar = sum(list.filter(function (k) { return k.jenis === 'Keluar'; }), function (k) { return k.nominal; });
  var h = '<div class="bar"><div class="pagetitle" style="margin:0">Kas</div><div style="display:flex;gap:8px;align-items:center"><select class="plain" onchange="FILTER.kas=this.value;tampil(\'kas\')"><option value="">Semua bulan</option>' +
    bulanList.map(function (b) { return '<option value="' + b + '"' + (b === f ? ' selected' : '') + '>' + BLN[Number(b.slice(5)) - 1] + ' ' + b.slice(0, 4) + '</option>'; }).join('') + '</select><button class="ubah btn sm" onclick="formKas()">+ Catat</button></div></div>';
  // Ringkasan mengikuti filter bulan & chip. Pindah dana tidak dihitung (bukan pemasukan/pengeluaran).
  var judul = (f ? BLN[Number(f.slice(5)) - 1] + ' ' + f.slice(0, 4) : 'Semua bulan') + ' · ' + (sb === 'umum' ? 'transaksi Posetive' : sb === 'event' ? 'transaksi event' : 'semua transaksi');
  var bersih = masuk + setoran - keluar;
  // Transaksi owner langsung / reimburse ikut pemasukan & pengeluaran (laba), tapi tidak mengubah saldo kas divisi.
  var diLuar = sum(list.filter(function (k) { return k.jenis !== JENIS_PINDAH && !akunDivisi(akunKas(k)); }), function (k) { return k.jenis === 'Masuk' ? k.nominal : -num(k.nominal); });
  h += '<div class="head2 head2b kas-kepala">' + htmlSaldoKas() +
    '<div class="card pad"><div class="meta">' + judul + '</div><table style="margin-top:4px">' +
    '<tr><td>Pemasukan</td><td class="r pos">+' + rp(masuk) + '</td></tr>' +
    '<tr><td>Setoran owner</td><td class="r">+' + rp(setoran) + '</td></tr>' +
    '<tr><td>Pengeluaran</td><td class="r">−' + rp(keluar) + '</td></tr>' +
    '<tr class="total"><td>Bersih periode ini</td><td class="r ' + cls(bersih) + '">' + (bersih > 0 ? '+' : '') + rp(bersih) + '</td></tr></table>' +
    (Math.round(diLuar) ? '<div class="meta" style="margin-top:6px">Termasuk ' + rp(Math.abs(diLuar)) + ' dibayar owner langsung / reimburse — ikut dihitung di sini, tapi tidak mengubah saldo kas divisi.</div>' : '') + '</div></div>';
  h += '<div class="chips" style="margin-bottom:14px">' + [['', 'Semua'], ['umum', 'Posetive'], ['event', 'Event']].map(function (c) {
    return '<button class="chip ' + (c[0] === sb ? 'on' : '') + '" onclick="FILTER.kasSumber=\'' + c[0] + '\';tampil(\'kas\')">' + c[1] + '</button>';
  }).join('') + '</div>';
  h += '<div class="card">' + (list.length ? list.map(barisKas).join('') : '<div class="empty">Belum ada transaksi.</div>') + '</div>';
  return h;
}


function vStok() {
  if (D.serverLama) return '<div class="pagetitle">Stok</div>' + notice('bad', '<b>Code.gs di Apps Script masih versi lama.</b> Halaman Stok butuh Code.gs terbaru (281 baris). Tempel ulang Code.gs, simpan, lalu Terapkan → Kelola deployment → Versi baru.');
  var h = '<div class="bar"><div class="pagetitle" style="margin:0">Stok</div><div style="display:flex;gap:8px"><button class="ubah btn sm ghost" onclick="formMutasi(null,\'Hitung Fisik\')">Hitung fisik</button><button class="ubah btn sm" onclick="formMutasi(null,\'Masuk\')">+ Beli</button></div></div>';
  var tk = tintaTerakhir();
  var kartu = BAHAN.map(function (b) {
    var n = stok(b), min = b === 'Kertas 4R' ? Pd('STOK_MIN_KERTAS', 100) : Pd('STOK_MIN_BUKU', 5), sat = b === 'Kertas 4R' ? 'lembar' : 'buku';
    var pakai = D.mutasi.filter(function (m) { return m.bahan === b && m.jenis === 'Keluar' && m.id_event; });
    var rata = pakai.length ? Math.round(sum(pakai, function (m) { return m.jumlah; }) / pakai.length) : null;
    return '<div class="card pad"><div class="meta">' + esc(b) + '</div><div class="big ' + (n !== null && n < min ? 'neg' : '') + '">' + (n === null ? '—' : n) + ' <span class="meta" style="font-size:14px">' + sat + '</span></div>' +
      '<div class="meta">Minimum ' + min + (b === 'Kertas 4R' && n !== null ? ' · ≈ ' + (n / (P('ISI_KERTAS') || 100)).toLocaleString('id-ID', {maximumFractionDigits: 1}) + ' pack' : '') + (rata !== null ? ' · rata-rata ' + rata + '/event' : '') + '</div></div>';
  });
  var tinta = '<div class="card pad"><div class="meta">Tinta Epson 057 (warna terendah)</div><div class="big ' + (tk && tk.level <= Pd('TINTA_MIN', 0.2) ? 'neg' : '') + '">' + (tk ? Math.round(tk.level * 100) + '%' : '—') + '</div>' +
    '<div class="meta">' + (tk ? 'Dari laporan ' + esc(tk.id_event) + ' (' + tgl(tk.tanggal) + ') · ≈ ' + Math.round(tk.level * P('KAPASITAS_TINTA')) + ' lembar lagi' : 'Isi "level tinta terendah" di laporan event') + '</div></div>';
  h += '<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">' + kartu.join('') + tinta + '</div>';
  var cekAwal = D.mutasi.filter(function (m) { return String(m.catatan || '').indexOf('CEK:') === 0; });
  cekAwal.forEach(function (m) { h += notice('', esc(m.bahan) + ': ' + esc(m.catatan.slice(4).trim())); });
  var list = D.mutasi.slice().sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : a.tanggal > b.tanggal ? -1 : (a.id < b.id ? 1 : -1); });
  h += sec('Riwayat', '<div class="card">' + (list.length ? list.map(function (m) {
    var tanda = m.jenis === 'Masuk' ? '+' : m.jenis === 'Keluar' ? '−' : '=';
    return item({lead: '<div class="ic ' + (m.jenis === 'Masuk' ? 'in' : '') + '">' + ikon(m.jenis === 'Masuk' ? 'down' : m.jenis === 'Keluar' ? 'up' : 'box') + '</div>',
      t: esc(m.bahan) + ' · ' + esc(m.jenis), s: tgl(m.tanggal) + (m.id_event ? ' · ' + esc(m.id_event) : '') + (m.catatan ? ' · ' + esc(String(m.catatan).replace(/^CEK:\s*/, '')) : ''),
      end: tanda + num(m.jumlah), on: "formMutasi('" + m.id + "')"});
  }).join('') : '<div class="empty">Belum ada catatan stok.</div>') + '</div>');
  return h;
}

var F_MUTASI = [
  {n: 'tanggal', l: 'Tanggal', t: 'date', def: 'today', wajib: 1},
  {n: 'bahan', l: 'Bahan', t: 'sel', o: function () { return BAHAN.map(function (b) { return [b, b]; }); }, def: 'Kertas 4R', wajib: 1},
  {n: 'jenis', l: 'Jenis', t: 'sel', o: function () { return [['Masuk', 'Masuk (beli)'], ['Keluar', 'Keluar (pakai/rusak)'], ['Hitung Fisik', 'Hitung fisik (set stok)']]; }, wajib: 1},
  {n: 'jumlah', l: 'Jumlah (lembar / buku). Kertas: 1 pack = 100 lembar', t: 'num', wajib: 1},
  {n: '_harga', l: 'Harga beli total (Rp) — otomatis dicatat di Kas', t: 'num', show: function (r) { return r.jenis === 'Masuk' && !r.id; }},
  {n: 'id_event', l: 'Event terkait', t: 'sel', o: pilEvent},
  {n: 'catatan', l: 'Catatan', t: 'area'}
];
function formMutasi(id, jenis) {
  var m = id ? cari(D.mutasi, 'id', id) : {jenis: jenis};
  var extra = id ? '<button class="ubah btn danger" type="button" onclick="hapus(\'MUTASI_STOK\',\'' + id + '\')">Hapus</button>' : '';
  if (m && String(m.sumber || '').indexOf('LAPORAN:') === 0) extra = '<div class="meta">Dibuat otomatis dari laporan ' + esc(m.id_event) + '. Ubah laporannya, bukan catatan ini.</div>';
  bukaForm(id ? 'Stok ' + id : (jenis === 'Hitung Fisik' ? 'Hitung fisik stok' : 'Catat stok'), F_MUTASI, m, function (r) {
    var harga = r._harga; delete r._harga;
    return panggil('simpanMutasi', r, harga || 0);
  }, extra);
}


function pilihBukti(inp) {
  var f = inp.files[0]; if (!f) return;
  var ok = {'image/png': 1, 'image/jpeg': 1, 'application/pdf': 1};
  if (!ok[f.type]) { toast('Harus PNG, JPG, atau PDF'); inp.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function () {
    NOTA_BARU = {base64: reader.result.split(',')[1], mime: f.type};
    var span = document.getElementById('bukti_nama'); if (span) span.textContent = f.name;
  };
  reader.readAsDataURL(f);
}
// Kategori kas per jenis. Kategori baru di tab PILIHAN yang tidak ada di daftar ini dikenali dari riwayat Kas
// (dipakai hanya untuk satu jenis); bila belum pernah dipakai, muncul di kedua jenis.
var KAT_KAS = {
  Masuk: ['Penjualan Event', 'Penjualan', 'DP / Pelunasan Kontrak', 'Setoran Owner', 'Pembayaran Panitia', 'Klaim Voucher Mitra', 'Sewa Alat'],
  Keluar: ['Pengadaan Barang', 'Media Cetak', 'Fee Crew', 'Transport', 'Konsumsi', 'Fee Panitia / Sewa Lapak', 'Langganan Software',
    'Admin QRIS', 'Admin Pencairan QRIS', 'Bagi Hasil Panitia', 'Setor ke Owner'],
  Keduanya: ['Lainnya', 'Penyesuaian Saldo']
};
function jenisKategori(k) {
  if (KAT_KAS.Keduanya.indexOf(k) >= 0) return '';
  if (KAT_KAS.Masuk.indexOf(k) >= 0) return 'Masuk';
  if (KAT_KAS.Keluar.indexOf(k) >= 0) return 'Keluar';
  var pakai = {};
  (D.kas || []).forEach(function (x) { if (x.kategori === k && x.jenis) pakai[x.jenis] = true; });
  var j = Object.keys(pakai);
  return j.length === 1 ? j[0] : '';
}
/** Pilihan kategori untuk jenis ini; kategori yang sedang tersimpan tetap ikut (catatan lama tidak hilang kategorinya). */
function opsiKategoriKas(jenis, sekarang) {
  var l = (D.pilihan['Kategori Kas'] || []).filter(function (k) { var j = jenisKategori(k); return !jenis || !j || j === jenis; });
  if (sekarang && l.indexOf(sekarang) < 0) l.push(sekarang);
  return l.map(function (v) { return [v, v]; });
}
/** Jenis diganti → pilihan kategori ikut berganti; kategori yang tidak cocok dikosongkan. */
function isiUlangKategoriKas(lama, jenis) {
  if (jenis === JENIS_PINDAH) return; // Pindah dana tidak memakai kategori
  var sel = document.getElementById('frm').elements.kategori; if (!sel) return;
  var v = sel.value, opsi = opsiKategoriKas(jenis), cocok = opsi.some(function (o) { return o[0] === v; });
  sel.innerHTML = '<option value="">— pilih —</option>' + opsi.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('');
  sel.value = cocok ? v : '';
  if (v && !cocok) toast('Kategori "' + v + '" bukan untuk kas ' + String(jenis).toLowerCase() + ' — pilih lagi');
}
function jenisPindah(r) { return r.jenis === JENIS_PINDAH; }
function bukanPindah(r) { return r.jenis !== JENIS_PINDAH; }
var F_KAS = [
  {n: 'tanggal', l: 'Tanggal', t: 'date', def: 'today', wajib: 1}, {n: 'jenis', l: 'Jenis', t: 'sel', o: pil('Jenis Kas'), def: 'Keluar', wajib: 1, setelahGanti: isiUlangKategoriKas},
  {n: 'nominal', l: 'Nominal (Rp)', t: 'num', wajib: 1},
  {n: 'kategori', l: 'Kategori', t: 'sel', wajib: bukanPindah, show: bukanPindah, o: function () { return opsiKategoriKas(FORM && FORM.rec.jenis, FORM && FORM.rec.kategori); }},
  {n: 'akun', l: 'Akun — dari mana / ke mana uangnya (Pindah dana: akun asal)', t: 'sel', wajib: 1, def: AKUN_BCA, o: function () { return AKUN_KAS; }},
  {n: 'akun_tujuan', l: 'Ke akun', t: 'sel', wajib: jenisPindah, show: jenisPindah, o: function () { return AKUN_KAS.filter(function (a) { return a[0] !== AKUN_OWNER; }); },
    cek: function (r) { return r.jenis === JENIS_PINDAH && r.akun === r.akun_tujuan ? 'Pindah dana: akun asal dan tujuan tidak boleh sama.' : ''; }},
  {n: 'keterangan', l: 'Keterangan'}, {n: 'id_event', l: 'Event terkait', t: 'sel', o: pilEvent},
  {n: 'metode', l: 'Metode', t: 'sel', o: pil('Metode')}, {n: 'no_nota', l: 'Nota / bukti (PNG, JPG, atau PDF)', t: 'bukti'}, {n: 'catatan', l: 'Catatan', t: 'area'}
];
function formKas(id, idEvent, isian) {
  var k = id ? cari(D.kas, 'id', id) : Object.assign({id_event: idEvent || ''}, isian);
  if (id && !k.akun) k = Object.assign({}, k, {akun: AKUN_LAMA}); // catatan sebelum ada kolom akun
  NOTA_BARU = null;
  var extra = id ? '<button class="ubah btn danger" type="button" onclick="hapus(\'KAS\',\'' + id + '\')">Hapus</button>' : '';
  if (k && String(k.sumber || '').indexOf('LAPORAN:') === 0) extra = '<div class="meta">Dibuat otomatis dari laporan ' + esc(k.id_event) + ' (admin QRIS/pencairan). Ubah laporannya, bukan catatan ini.</div>';
  if (k && String(k.sumber || '').indexOf('TUGAS:') === 0) extra = '<div class="meta">Dibuat otomatis dari pembayaran fee crew (' + esc(String(k.sumber).slice(6)) + '). Ubah fee atau batalkan pembayaran dari halaman event ' + esc(k.id_event) + '.</div>';
  bukaForm(id ? 'Kas ' + id : 'Catat kas', F_KAS, k, function (r) {
    if (r.jenis === JENIS_PINDAH) r.kategori = 'Pindah Dana'; else r.akun_tujuan = '';
    return panggil('saveRecord', 'KAS', r).then(function (idBaru) {
      if (!NOTA_BARU) return idBaru;
      var ext = {'image/png': '.png', 'image/jpeg': '.jpg', 'application/pdf': '.pdf'}[NOTA_BARU.mime] || '';
      var nama = idBaru + ' - ' + r.tanggal + (r.kategori ? ' - ' + r.kategori : '') + ext;
      return panggil('simpanNotaKas', idBaru, NOTA_BARU.base64, NOTA_BARU.mime, nama).then(function () { return idBaru; });
    });
  }, extra);
}
</script>
