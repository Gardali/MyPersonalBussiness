<script>
// Posetive — halaman Event & detailnya, checklist alat, invoice, Unduh Laporan, form event & laporan.
function vEvent() {
  var now = D.hariIni;
  var depan = D.event.filter(function (e) { return e.tanggal >= now && e.status !== 'Batal'; }).sort(function (a, b) { return a.tanggal < b.tanggal ? -1 : 1; });
  var lalu = D.event.filter(function (e) { return !(e.tanggal >= now && e.status !== 'Batal'); }).sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : -1; });
  function baris(e) {
    var r = hasilEvent(e), perlu = e.status === 'Terkonfirmasi' && e.tanggal < now;
    return item({lead: dt(e.tanggal), t: esc(e.nama_event), s: esc(e.model_pendapatan || 'Model belum diisi'),
      end: waBtn(kontakEvent(e)) + (e.status === 'Selesai' ? '<span class="' + cls(r.labaKotor) + '">' + rpSingkat(r.labaKotor) + '</span><div class="s">laba kotor</div>' : perlu ? '<span class="pill p-warn">Perlu laporan</span>' : statusPill(e.status)),
      on: "bukaEvent('" + e.id_event + "')"});
  }
  var h = '<div class="bar"><div class="pagetitle" style="margin:0">Event</div><button class="btn sm" onclick="formEvent()">+ Event</button></div>';
  h += '<div class="cols"><div class="col">';
  h += sec('Akan datang', '<div class="card">' + (depan.length ? depan.map(baris).join('') : '<div class="empty">Belum ada.</div>') + '</div>');
  h += '</div><div class="col">';
  h += sec('Sudah lewat', '<div class="card">' + (lalu.length ? lalu.map(baris).join('') : '<div class="empty">Belum ada.</div>') + '</div>');
  return h + '</div></div>';
}

function bukaEvent(id) { DETAIL = id; tampil('event'); }

function vDetailEvent() {
  var e = D.event.filter(function (x) { return x.id_event === DETAIL; })[0];
  if (!e) { DETAIL = null; return vEvent(); }
  var r = hasilEvent(e), lap = r.lap, openBooth = e.model_pendapatan !== 'Kontrak Klien';
  var h = '<button class="back" onclick="DETAIL=null;tampil(\'event\')">‹ Event</button>';
  h += '<div class="meta">' + hari(e.tanggal) + ', ' + tgl(e.tanggal) + (e.jam_buka ? ' · ' + esc(e.jam_buka) + '–' + esc(e.jam_tutup) : '') + '</div>';
  h += '<div class="pagetitle" style="margin:2px 0 6px">' + esc(e.nama_event) + '</div>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">' + statusPill(e.status) + '<span class="pill">' + esc(e.model_pendapatan || 'Model belum diisi') + '</span>' + (e.skema ? '<span class="pill">' + esc(e.skema) + '</span>' : '') + '</div>';
  var kEv = kontakEvent(e);
  h += '<div class="meta">' + esc(e.lokasi || '') + (e.tim ? ' · ' + esc(e.tim) : '') + (kEv ? ' · ' + esc(kEv) + ' ' + waBtn(kEv) : '') + '</div>';
  h += '<div class="btns" style="margin-bottom:20px"><button class="btn sm" onclick="formLaporan(\'' + e.id_event + '\')">' + (lap ? 'Ubah laporan' : 'Isi laporan') + '</button><button class="btn sm ghost" onclick="formKas(null,\'' + e.id_event + '\')">+ Kas</button><button class="btn sm ghost" onclick="bukaChecklist(\'' + e.id_event + '\')">Checklist alat</button><button class="btn sm ghost" onclick="unduhLaporanEvent(\'' + e.id_event + '\',this)">Unduh Laporan</button>' + (e.model_pendapatan === 'Kontrak Klien' ? '<button class="btn sm ghost" onclick="buatInvoiceUI(\'' + e.id_event + '\',this)">Invoice PDF</button>' : '') + '<button class="btn sm ghost" onclick="formEvent(\'' + e.id_event + '\')">Ubah</button></div>';
  if (String(e.catatan || '').indexOf('CEK:') === 0) h += notice('', esc(e.catatan.slice(4).trim()));

  var hk = '<div class="card pad"><div class="meta">Laba kotor</div><div class="big ' + cls(r.labaKotor) + '">' + rp(r.labaKotor) + '</div>' +
    '<div class="meta" style="margin-bottom:8px">Setelah alokasi Jepreto + penyusutan: <b class="' + cls(r.labaBersih) + '">' + rp(r.labaBersih) + '</b></div><table>' +
    '<tr><td>Pemasukan</td><td class="r">' + rp(r.masuk) + '</td></tr>' +
    '<tr><td>Biaya langsung</td><td class="r">−' + rp(r.keluar) + '</td></tr>' +
    '<tr><td>Bahan · ' + r.tercetak + ' lbr × ' + rp(r.bl) + '</td><td class="r">−' + rp(r.bahan) + '</td></tr>' +
    '<tr><td>Alokasi per event</td><td class="r">−' + rp(r.alokasi) + '</td></tr></table>';
  hk += '</div>';
  var tg = tagihan(e, r);
  if (tg) {
    var pctBayar = Math.min(100, Math.round(tg.dibayar / tg.kontrak * 100)), pctDp = Math.round(tg.dp / tg.kontrak * 100);
    var tahapBaris = function (label, nominal, lunas, jatuh) {
      return '<tr><td>' + label + (jatuh ? ' <span class="meta">· ' + tgl(jatuh) + '</span>' : '') + '</td><td class="r">' + rp(nominal) + ' ' + (lunas ? '<span class="pill p-ok">Lunas</span>' : '<span class="pill">Belum</span>') + '</td></tr>';
    };
    hk += '<div class="card pad" style="margin-top:8px"><div class="meta">Pembayaran klien</div>' +
      '<div style="font-weight:700;margin:2px 0 10px">' + rp(tg.dibayar) + ' dari ' + rp(tg.kontrak) + '</div>' +
      '<div style="position:relative;height:10px;border-radius:10px;background:var(--soft);overflow:hidden"><div style="height:100%;width:' + pctBayar + '%;background:' + (tg.kurang ? 'var(--accent)' : 'var(--ok)') + ';border-radius:10px"></div>' +
      (tg.dp && tg.dp < tg.kontrak ? '<div style="position:absolute;top:0;bottom:0;left:' + pctDp + '%;width:2px;background:var(--card)"></div>' : '') + '</div><table style="margin-top:10px">' +
      (tg.dp ? tahapBaris('DP', tg.dp, tg.dibayar >= tg.dp, e.jatuh_tempo_dp) : '') +
      tahapBaris(tg.dp ? 'Pelunasan' : 'Pembayaran penuh', tg.kontrak - tg.dp, tg.dibayar >= tg.kontrak, e.jatuh_tempo_pelunasan || e.tanggal) + '</table>' +
      (tg.kurang ? '<div class="meta ' + (tg.sisaHari !== null && tg.sisaHari < 0 ? 'neg' : '') + '" style="margin:8px 0 10px">Tagih ' + (tg.tahap === 'DP' ? 'DP' : 'pelunasan') + ' <b>' + rp(tg.kurang) + '</b> · ' + teksJatuhTempo(tg) + '</div>' +
        '<button class="btn sm" onclick="formKas(null,\'' + e.id_event + '\',{jenis:\'Masuk\',kategori:\'DP / Pelunasan Kontrak\',nominal:' + tg.kurang + ',keterangan:\'' + (tg.tahap === 'DP' ? 'DP' : 'Pelunasan') + ' ' + esc(String(e.nama_event).replace(/['\\]/g, '')) + '\'})">+ Catat pembayaran</button>' : '') + '</div>';
  }
  if (openBooth && r.bepLapangan !== null) {
    var terjual = lap ? r.lembarTerjual : 0, pct = Math.min(100, Math.round(terjual / (r.bepTotal || 1) * 100)), pctL = Math.min(100, Math.round(r.bepLapangan / (r.bepTotal || 1) * 100));
    hk += '<div class="card pad" style="margin-top:8px"><div class="meta">Titik impas (untung ' + rp(r.untungLembar) + '/lembar)</div>' +
      '<div style="font-weight:700;margin:2px 0 10px">' + terjual + ' terjual dari ' + r.bepTotal + ' lembar</div>' +
      '<div style="position:relative;height:10px;border-radius:10px;background:var(--soft);overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + (terjual >= r.bepTotal ? 'var(--ok)' : 'var(--accent)') + ';border-radius:10px"></div></div>' +
      '<div style="position:relative;height:18px"><div style="position:absolute;left:' + pctL + '%;transform:translateX(-50%);top:2px;font-size:11px;color:var(--muted)">▲ ' + r.bepLapangan + '</div></div>' +
      '<div class="meta">' + r.bepLapangan + ' lembar menutup biaya lapangan · ' + r.bepTotal + ' lembar termasuk alokasi</div></div>';
  }
  h += '<div class="cols"><div class="col">' + sec('Keuangan', hk);

  if (lap) {
    var lp = '<div class="card pad"><table>' +
      '<tr><td>Jam aktual</td><td class="r">' + esc(lap.jam_buka_aktual || '—') + '–' + esc(lap.jam_tutup_aktual || '—') + '</td></tr>' +
      '<tr><td>Transaksi</td><td class="r">' + num(lap.jumlah_transaksi) + '</td></tr>' +
      '<tr><td>Sesi · Lembar/strip tambahan · Grad Book</td><td class="r">' + r.sesiTerjual + ' · ' + r.lembarTambahan + ' · ' + num(lap.grad_book_terjual) + '</td></tr>' +
      '<tr><td>Tercetak (counter)</td><td class="r">' + r.tercetak + '</td></tr>' +
      '<tr><td>Terjual + uji + gagal</td><td class="r">' + r.lembarTerjual + ' + ' + num(lap.lembar_uji_bonus) + ' + ' + num(lap.lembar_gagal) + '</td></tr>' +
      '<tr class="total"><td>Selisih lembar</td><td class="r ' + (r.selisihLembar ? 'neg' : 'pos') + '">' + (r.selisihLembar ? r.selisihLembar + ' · periksa' : 'Cocok') + '</td></tr>' +
      '<tr><td>Omzet menurut laporan</td><td class="r">' + rp(r.omzet) + '</td></tr>' +
      '<tr><td>Uang diterima</td><td class="r">' + rp(r.diterima) + '</td></tr>' +
      '<tr class="total"><td>Selisih kas</td><td class="r ' + (r.selisihKas ? 'neg' : 'pos') + '">' + (r.selisihKas ? rp(r.selisihKas) : 'Cocok') + '</td></tr></table>';
    if (lap.rekomendasi) lp += '<div class="meta" style="margin-top:10px"><b>Rekomendasi</b><br>' + esc(lap.rekomendasi) + '</div>';
    if (lap.kendala) lp += '<div class="meta" style="margin-top:8px"><b>Kendala</b><br>' + esc(lap.kendala) + '</div>';
    lp += '</div>';
    if (Math.abs(r.omzet - r.masuk) > 0) lp += '<div style="margin-top:8px">' + notice('', 'Omzet laporan ' + rp(r.omzet) + ' ≠ pemasukan di Kas ' + rp(r.masuk) + '. Pastikan penjualan sudah dicatat.') + '</div>';
    h += sec('Laporan produksi', lp);
  }
  var rabBaris = [['Penyusutan', r.rab.penyusutan, r.realisasi.penyusutan], ['Langganan Jepreto', r.rab.jepreto, r.realisasi.jepreto],
    ['Fee crew', r.rab.feeCrew, r.realisasi.feeCrew], ['Transport', r.rab.transport, r.realisasi.transport], ['Konsumsi', r.rab.konsumsi, r.realisasi.konsumsi]];
  if (rabBaris.some(function (x) { return x[1]; })) {
    var rabTotal = 0, realTotal = 0;
    var rb = '<div class="card pad"><table><tr><td></td><td class="r" style="font-weight:600">RAB</td><td class="r" style="font-weight:600">Realisasi</td><td class="r" style="font-weight:600">Selisih</td></tr>' +
      rabBaris.map(function (x) {
        rabTotal += x[1]; realTotal += x[2];
        var s = x[2] - x[1];
        return '<tr><td>' + x[0] + '</td><td class="r">' + rp(x[1]) + '</td><td class="r">' + rp(x[2]) + '</td><td class="r ' + (s > 0 ? 'neg' : s < 0 ? 'pos' : '') + '">' + (s ? rp(s) : '—') + '</td></tr>';
      }).join('') +
      '<tr class="total"><td>Total</td><td class="r">' + rp(rabTotal) + '</td><td class="r">' + rp(realTotal) + '</td><td class="r ' + (realTotal > rabTotal ? 'neg' : realTotal < rabTotal ? 'pos' : '') + '">' + (realTotal !== rabTotal ? rp(realTotal - rabTotal) : '—') + '</td></tr></table></div>';
    h += sec('RAB vs Realisasi', rb + '<div class="meta" style="margin-top:8px">' + (lap ? 'Penyusutan & Jepreto terkunci sesuai kondisi Inventaris saat laporan disimpan.' : 'Penyusutan & Jepreto masih perkiraan langsung dari Inventaris — terkunci setelah laporan diisi.') + '</div>');
  }
  h += '</div><div class="col">';
  var tugas = D.tugas.filter(function (t) { return t.id_event === e.id_event; });
  var totalFee = sum(tugas, function (t) { return t.fee; }), belumFee = tugas.filter(function (t) { return !feeLunas(t); });
  h += sec('Crew bertugas', '<div class="card">' + (tugas.length ? tugas.map(function (t) {
    var lunas = feeLunas(t), nm = namaCrew(t.id_crew), bt = e.status === 'Batal' ? [] : bentrokCrew(t.id_crew, e);
    return item({lead: '<div class="av">' + inisial(nm) + '</div>', t: esc(nm) + (bt.length ? ' <span class="pill p-bad">Bentrok</span>' : ''),
      s: (bt.length ? '<span class="neg">Juga di ' + bt.map(function (x) { return esc(x.nama_event); }).join(', ') + '</span><br>' : '') + 'Fee ' + rp(t.fee) + (t.catatan ? ' · ' + esc(t.catatan) : ''),
      end: lunas ? '<span class="pill p-ok">Dibayar</span>' : '<button class="btn sm" onclick="event.stopPropagation();formBayarFee([\'' + t.id + '\'])">Bayar</button>',
      on: "formTugas('" + t.id + "')"});
  }).join('') : '<div class="empty">Belum ada crew yang ditugaskan.</div>') + '</div><div class="meta" style="margin-top:8px">' +
    tugas.length + (num(e.jumlah_crew) ? ' dari ' + num(e.jumlah_crew) : '') + ' crew · total fee ' + rp(totalFee) + (r.rab.feeCrew ? ' (RAB ' + rp(r.rab.feeCrew) + ')' : '') +
    (belumFee.length > 1 ? ' · <button class="link" style="border:0;background:none;color:var(--accent);font-weight:600;padding:0" onclick="formBayarFee(' + esc(JSON.stringify(belumFee.map(function (t) { return t.id; }))) + ')">Bayar semua (' + rp(sum(belumFee, function (t) { return t.fee; })) + ')</button>' : '') + '</div>',
    '<button class="link" onclick="formTugas(null,\'' + e.id_event + '\')">+ Crew</button>');
  var alat = D.pemakaian.filter(function (a) { return a.id_event === e.id_event && a.dibawa === 'Ya'; }), blm = alat.filter(function (a) { return a.kembali !== 'Ya'; });
  h += sec('Alat', '<div class="card pad" style="cursor:pointer" onclick="bukaChecklist(\'' + e.id_event + '\')">' + (alat.length ?
    '<div style="font-weight:700">' + alat.length + ' dibawa · ' + (alat.length - blm.length) + ' kembali</div>' + (blm.length ? '<div class="meta neg" style="margin-top:4px">Belum kembali: ' + blm.map(function (a) { return esc(a.nama_alat); }).join(', ') + '</div>' : '<div class="meta pos" style="margin-top:4px">Semua alat sudah kembali.</div>') :
    '<div class="meta">Belum ada checklist. Ketuk untuk mencentang alat yang dibawa.</div>') + '</div>');
  h += sec('Transaksi', '<div class="card">' + (r.kas.length ? r.kas.map(barisKas).join('') : '<div class="empty">Belum ada catatan kas untuk event ini.</div>') + '</div>');
  return h + '</div></div>';
}

// ---------------------------------------------------------------- checklist alat
var CL = null;
function bukaChecklist(idEvent) {
  var ada = D.pemakaian.filter(function (a) { return a.id_event === idEvent; });
  var rows = {};
  D.inventaris.filter(function (x) { return x.kategori === 'Aset'; }).forEach(function (x) {
    rows[x.id_alat] = {id_alat: x.id_alat, nama_alat: x.nama, dibawa: 'Tidak', kembali: '', kondisi_akhir: x.kondisi || 'Baik', catatan: '', pemilik: x.pemilik};
  });
  // set/alat tanpa kode dari checklist mana pun
  D.pemakaian.filter(function (a) { return !a.id_alat; }).forEach(function (a) { rows['SET:' + a.nama_alat] = rows['SET:' + a.nama_alat] || {id_alat: '', nama_alat: a.nama_alat, dibawa: 'Tidak', kembali: '', kondisi_akhir: 'Baik', catatan: ''}; });
  ada.forEach(function (a) { var k = a.id_alat || 'SET:' + a.nama_alat; rows[k] = Object.assign(rows[k] || {}, a, {pemilik: pemilikAlat(a)}); });
  CL = {id: idEvent, rows: Object.keys(rows).map(function (k) { return rows[k]; }).sort(function (a, b) {
    return String(a.nama_alat).localeCompare(String(b.nama_alat));
  })};
  renderChecklist();
  document.getElementById('sheet').classList.add('open');
}
function salinChecklistTerakhir() {
  var ev = {}; D.event.forEach(function (e) { ev[e.id_event] = e; });
  var ids = Array.from(new Set(D.pemakaian.filter(function (a) { return a.id_event !== CL.id && ev[a.id_event]; }).map(function (a) { return a.id_event; })))
    .sort(function (a, b) { return ev[a].tanggal < ev[b].tanggal ? 1 : -1; });
  if (!ids.length) { toast('Belum ada checklist sebelumnya'); return; }
  var bawa = {}; D.pemakaian.filter(function (a) { return a.id_event === ids[0] && a.dibawa === 'Ya'; }).forEach(function (a) { bawa[a.id_alat || 'SET:' + a.nama_alat] = 1; });
  CL.rows.forEach(function (r) { r.dibawa = bawa[r.id_alat || 'SET:' + r.nama_alat] ? 'Ya' : 'Tidak'; });
  toast('Disalin dari ' + ids[0]); renderChecklist();
}
function clSet(i, k, v) { CL.rows[i][k] = v; if (k === 'dibawa' && v !== 'Ya') CL.rows[i].kembali = ''; renderChecklist(); }
function clSemuaKembali() { CL.rows.forEach(function (r) { if (r.dibawa === 'Ya') r.kembali = 'Ya'; }); renderChecklist(); }
function clTambah() { var n = prompt('Nama alat / set (mis. Set kabel & adapter)'); if (n) { CL.rows.push({id_alat: '', nama_alat: n, dibawa: 'Ya', kembali: '', kondisi_akhir: 'Baik', catatan: ''}); renderChecklist(); } }
function clHapus(i) { if (confirm('Keluarkan "' + CL.rows[i].nama_alat + '" dari daftar checklist ini?')) { CL.rows.splice(i, 1); renderChecklist(); } }
function renderChecklist() {
  var bawa = CL.rows.filter(function (r) { return r.dibawa === 'Ya'; }), kembali = bawa.filter(function (r) { return r.kembali === 'Ya'; });
  var h = '<div class="grab"></div><h2>Checklist alat · ' + esc(CL.id) + '</h2>' +
    '<div class="meta" style="margin-bottom:10px">' + bawa.length + ' dibawa · ' + kembali.length + ' kembali' + (bawa.length > kembali.length ? ' · <b class="neg">' + (bawa.length - kembali.length) + ' belum kembali</b>' : '') + '</div>' +
    '<div class="btns" style="margin:0 0 12px"><button class="btn sm ghost" type="button" onclick="salinChecklistTerakhir()">Salin dari event terakhir</button><button class="btn sm ghost" type="button" onclick="clSemuaKembali()">Semua kembali</button><button class="btn sm ghost" type="button" onclick="clTambah()">+ Alat/set</button></div><div class="card">';
  h += CL.rows.map(function (r, i) {
    var milik = r.pemilik && r.pemilik !== 'Posetive' ? ' <span class="pill p-warn">' + esc(r.pemilik) + '</span>' : '';
    return '<div class="it" style="flex-wrap:wrap"><div class="mid" style="min-width:140px"><div class="t">' + esc(r.nama_alat) + milik + '</div></div>' +
      '<label class="chk"><input type="checkbox" ' + (r.dibawa === 'Ya' ? 'checked' : '') + ' onchange="clSet(' + i + ',\'dibawa\',this.checked?\'Ya\':\'Tidak\')">Bawa</label>' +
      '<label class="chk"><input type="checkbox" ' + (r.kembali === 'Ya' ? 'checked' : '') + (r.dibawa === 'Ya' ? '' : ' disabled') + ' onchange="clSet(' + i + ',\'kembali\',this.checked?\'Ya\':\'\')">Kembali</label>' +
      (r.dibawa === 'Ya' ? '<select class="plain" style="padding:5px 8px" onchange="clSet(' + i + ',\'kondisi_akhir\',this.value)">' + (D.pilihan.Kondisi || ['Baik', 'Perlu Perbaikan', 'Rusak', 'Hilang']).map(function (k) { return '<option' + (k === r.kondisi_akhir ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + '</select>' : '') +
      '<button class="btn sm ghost" type="button" title="Keluarkan dari daftar" onclick="clHapus(' + i + ')" style="padding:4px 10px">✕</button></div>';
  }).join('') + '</div>';
  h += '<div class="btns"><button class="btn" type="button" style="flex:1" onclick="simpanChecklistUI(this)">Simpan</button><button class="btn ghost" type="button" onclick="tutupForm()">Batal</button></div>';
  var panel = document.getElementById('panel'), top = panel.scrollTop;
  panel.innerHTML = h; panel.scrollTop = top;
}
function simpanChecklistUI(btn) {
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  var rows = CL.rows.filter(function (r) { return r.dibawa === 'Ya' || D.pemakaian.some(function (a) { return a.id_event === CL.id && (a.id_alat || a.nama_alat) === (r.id_alat || r.nama_alat); }); })
    .map(function (r) { return {id_alat: r.id_alat, nama_alat: r.nama_alat, dibawa: r.dibawa, kembali: r.kembali, kondisi_akhir: r.dibawa === 'Ya' ? r.kondisi_akhir : '', catatan: r.catatan || ''}; });
  panggil('simpanChecklist', CL.id, rows).then(function () { tutupForm(); toast('Checklist tersimpan'); return muat(true); })
    .catch(function (e) { btn.disabled = false; btn.textContent = 'Simpan'; toast('Gagal: ' + (e && e.message || e)); });
}

// ---- invoice
function htmlInvoice(e) {
  var r = hasilEvent(e), p = e.id_pipeline ? cari(D.pipeline, 'id', e.id_pipeline) : null, P2 = D.pengaturan;
  var lunas = r.piutang !== undefined && r.piutang <= 0, bayar = r.kas.filter(bukanSetoran);
  var nomor = 'INV/' + String(e.tanggal).slice(0, 7).replace('-', '') + '/' + e.id_event;
  var td = 'padding:7px 0;border-top:1px solid #e6e1da;';
  var h = '<div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#1c1a17">' +
    '<table style="width:100%"><tr><td><div style="font-size:20px;font-weight:bold">' + esc(P2.NAMA_USAHA || 'Posetive Photobooth') + '</div><div style="color:#7a736a">' + esc(P2.KONTAK_USAHA || '') + '</div></td>' +
