<script>
// Posetive — halaman Event & detailnya, checklist alat, invoice, Unduh Laporan, form event & laporan.
function vEvent() {
  var now = D.hariIni;
  var depan = D.event.filter(function (e) { return e.tanggal >= now && e.status !== 'Batal'; }).sort(function (a, b) { return a.tanggal < b.tanggal ? -1 : 1; });
  var lalu = D.event.filter(function (e) { return !(e.tanggal >= now && e.status !== 'Batal'); }).sort(function (a, b) { return a.tanggal < b.tanggal ? 1 : -1; });
  function baris(e) {
    var r = hasilEvent(e), perlu = e.status === 'Terkonfirmasi' && e.tanggal < now, masuk = r.lap && r.lap.status_laporan === 'Menunggu dicek';
    return item({lead: dt(e.tanggal), t: esc(e.nama_event), s: esc(e.model_pendapatan || 'Model belum diisi'),
      end: waBtn(kontakEvent(e)) + (masuk ? '<span class="pill p-acc">Cek laporan</span>' : e.status === 'Selesai' ? '<span class="' + cls(r.labaKotor) + '">' + rp(r.labaKotor) + '</span><div class="s">laba kotor</div>' : perlu ? '<span class="pill p-warn">Perlu laporan</span>' : statusPill(e.status)),
      on: "bukaEvent('" + e.id_event + "')"});
  }
  var h = '<div class="bar"><div class="pagetitle" style="margin:0">Event</div><button class="ubah btn sm" onclick="formEvent()">+ Event</button></div>';
  h += '<div class="cols"><div class="col">';
  h += sec('Akan datang', '<div class="card">' + (depan.length ? depan.map(baris).join('') : '<div class="empty">Belum ada.</div>') + '</div>');
  h += '</div><div class="col">';
  h += sec('Sudah lewat', '<div class="card">' + (lalu.length ? lalu.map(baris).join('') : '<div class="empty">Belum ada.</div>') + '</div>');
  return h + '</div></div>';
}

function bukaEvent(id) { DETAIL = id; tampil('event'); }

/**
 * Kartu titik impas: tiga target lembar — sesuai RAB (biaya rencana), biaya nyata + alokasi, dan biaya lapangan nyata.
 * Bar diskalakan ke target terbesar; ◆ = RAB, ▲ = biaya lapangan nyata.
 */
function htmlTitikImpas(r, terjual, e) {
  var skala = Math.max(r.bepTotal || 0, r.bepRab || 0, terjual, 1), pos = function (n) { return Math.min(100, Math.round(n / skala * 100)); };
  var utama = r.bepRab !== null ? r.bepRab : r.bepTotal, tanda = function (n, simbol) { return '<div style="position:absolute;left:' + pos(n) + '%;transform:translateX(-50%);top:2px;font-size:11px;color:var(--muted);white-space:nowrap">' + simbol + ' ' + n + '</div>'; };
  var target = function (label, n, ket) {
    if (n === null) return r.bepKs ? '<tr><td>' + label + '</td><td class="r"><b class="neg">tidak impas</b><div class="meta">bagi hasil terlalu besar</div></td></tr>' : '';
    var capai = terjual >= n;
    return '<tr><td>' + label + (ket ? '<div class="meta">' + ket + '</div>' : '') + '</td><td class="r"><b>' + n + ' lembar</b><div class="meta ' + (capai ? 'pos' : '') + '">' + (capai ? 'tercapai' : 'kurang ' + (n - terjual)) + '</div></td></tr>';
  };
  return '<div class="card pad" style="margin-top:8px"><div class="meta">Titik impas (untung ' + rp(r.untungLembar) + '/lembar)</div>' +
    '<div style="font-weight:700;margin:2px 0 10px">' + terjual + ' terjual' + (utama ? ' dari ' + utama + ' lembar' + (r.bepRab !== null ? ' (sesuai RAB)' : '') : '') + '</div>' +
    '<div style="position:relative;height:10px;border-radius:10px;background:var(--soft);overflow:hidden"><div style="height:100%;width:' + pos(terjual) + '%;background:' + (terjual >= utama ? 'var(--ok)' : 'var(--accent)') + ';border-radius:10px"></div></div>' +
    '<div style="position:relative;height:18px">' + (r.bepRab !== null ? tanda(r.bepRab, '◆') : '') + (r.bepLapangan !== null && r.bepLapangan !== r.bepRab ? tanda(r.bepLapangan, '▲') : '') + '</div>' +
    '<table>' + (r.rabTotal > 0 ? target('◆ Sesuai RAB', r.bepRab, 'RAB ' + rp(r.rabTotal) + (r.bepKs ? '' : ' ÷ ' + rp(r.untungLembar))) : '') +
    target('Biaya nyata + alokasi', r.bepTotal, rp(r.keluar) + ' + alokasi ' + rp(r.alokasi)) +
    target('▲ Biaya lapangan nyata', r.bepLapangan, 'kas keluar ' + rp(r.keluar) + (r.bepKs ? ' (bagi hasil yang sudah dibayar tidak dihitung dua kali)' : '')) + '</table>' +
    (r.bepKs ? '<div class="meta" style="margin-top:6px">Sudah memperhitungkan ' + (r.bepKs === 'D' ? 'fee panitia ' + rp(r.feePanitia) + ' sebagai biaya tetap' : 'bagi hasil panitia Skema ' + r.bepKs + ' (' + esc(KS_NAMA[r.bepKs]) + ') per jumlah sesi') + '.</div>' : '') +
    (r.rabTotal > 0 ? '' : '<div class="meta" style="margin-top:6px">Isi RAB di Ubah event untuk melihat titik impas sesuai rencana.</div>') + '</div>';
}

// ---- foto bukti & persetujuan laporan (admin/pemantau)
var FOTO_LAP = {kunci: '', isi: null};
/** Foto dimuat dari server sekali per set foto (kunci = ID file), lalu disimpan sementara di FOTO_LAP. */
function htmlFotoBukti(lap) {
  var kunci = lap.id_event + ':' + FOTO_KOLOM.map(function (x) { return lap[x[0]] || ''; }).join('|');
  if (!FOTO_KOLOM.some(function (x) { return lap[x[0]]; })) return '<div class="meta">Belum ada foto. Crew memotret counter printer & uang lewat form laporan.</div>';
  if (FOTO_LAP.kunci === kunci && FOTO_LAP.isi) return isiFotoBukti(FOTO_LAP.isi);
  if (FOTO_LAP.kunci !== kunci) {
    FOTO_LAP = {kunci: kunci, isi: null};
    panggil('fotoLaporan', lap.id_event).then(function (list) {
      if (FOTO_LAP.kunci !== kunci) return;
      FOTO_LAP.isi = list;
      var el = document.getElementById('foto_bukti'); if (el) el.innerHTML = isiFotoBukti(list);
    }).catch(function (err) { FOTO_LAP.kunci = ''; var el = document.getElementById('foto_bukti'); if (el) el.innerHTML = '<div class="meta neg">Foto gagal dimuat: ' + esc(err && err.message || err) + '</div>'; });
  }
  return '<div class="meta">Memuat foto…</div>';
}
function isiFotoBukti(list) {
  if (!list.length) return '<div class="meta">Belum ada foto.</div>';
  return '<div class="foto-grid">' + list.map(function (f) {
    return '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + (f.data ? '<img src="' + f.data + '" alt="' + esc(f.label) + '">' : '<div class="foto-kosong">Buka di Drive</div>') + '<span>' + esc(f.label) + '</span></a>';
  }).join('') + '</div>';
}
function setujuiLaporanUI(id, btn) {
  var e = cari(D.event, 'id_event', id), lap = cari(D.laporan, 'id_event', id), r = hasilEvent(e), cat = [];
  if (r.selisihLembar) cat.push('selisih lembar ' + r.selisihLembar);
  if (r.selisihKas) cat.push('selisih kas ' + rp(r.selisihKas));
  if (!confirm('Setujui laporan ' + e.nama_event + '?' + (cat.length ? '\n\nMasih ada ' + cat.join(' & ') + '.' : '') + (e.status === 'Terkonfirmasi' ? '\n\nEvent akan ditandai Selesai' : '') + (lap.dikirim_oleh ? ' dan crew tidak bisa mengubah laporan lagi.' : '.'))) return;
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  panggil('setujuiLaporan', id).then(function () { toast('Laporan disetujui'); return muat(true); })
    .catch(function (err) { btn.disabled = false; btn.textContent = 'Setujui laporan'; toast('Gagal: ' + (err && err.message || err)); });
}
function batalSetujuiUI(id, btn) {
  if (!confirm('Batalkan persetujuan laporan ini? Status event tidak berubah — ubah lewat tombol Ubah bila perlu.')) return;
  btn.disabled = true;
  panggil('batalSetujuiLaporan', id).then(function () { toast('Persetujuan dibatalkan'); return muat(true); })
    .catch(function (err) { btn.disabled = false; toast('Gagal: ' + (err && err.message || err)); });
}

function vDetailEvent() {
  var e = D.event.filter(function (x) { return x.id_event === DETAIL; })[0];
  if (!e) { DETAIL = null; return vEvent(); }
  var r = hasilEvent(e), lap = r.lap, openBooth = e.model_pendapatan !== 'Kontrak Klien';
  var h = '<button class="back" onclick="DETAIL=null;tampil(\'event\')">‹ Event</button>';
  h += '<div class="meta">' + hari(e.tanggal) + ', ' + tgl(e.tanggal) + (e.jam_buka ? ' · ' + esc(e.jam_buka) + '–' + esc(e.jam_tutup) : '') + '</div>';
  h += '<div class="pagetitle" style="margin:2px 0 6px">' + esc(e.nama_event) + '</div>';
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">' + statusPill(e.status) + '<span class="pill">' + esc(e.model_pendapatan || 'Model belum diisi') + '</span>' + (e.skema ? '<span class="pill">' + esc(e.skema) + '</span>' : '') + '</div>';
  var kEv = kontakEvent(e);
  h += '<div class="meta">' + esc(e.lokasi || '') + (e.tim ? ' · ' + esc(e.tim) : '') + (kEv ? ' · ' + esc(kEv) + ' ' + waBtn(kEv) : '') + '</div>';
  h += '<div class="btns" style="margin-bottom:20px"><button class="ubah btn sm" onclick="formLaporan(\'' + e.id_event + '\')">' + (lap ? 'Ubah laporan' : 'Isi laporan') + '</button><button class="ubah btn sm ghost" onclick="formKas(null,\'' + e.id_event + '\')">+ Kas</button><button class="btn sm ghost" onclick="bukaChecklist(\'' + e.id_event + '\')">Checklist alat</button><button class="btn sm ghost" onclick="bukaVoucher(\'' + e.id_event + '\')">Voucher</button><button class="btn sm ghost" onclick="unduhLaporanEvent(\'' + e.id_event + '\',this)">Unduh Laporan</button>' + (e.model_pendapatan === 'Kontrak Klien' ? '<button class="btn sm ghost" onclick="buatInvoiceUI(\'' + e.id_event + '\',this)">Invoice PDF</button>' : '') + '<button class="ubah btn sm ghost" onclick="formEvent(\'' + e.id_event + '\')">Ubah</button></div>';
  if (String(e.catatan || '').indexOf('CEK:') === 0) h += notice('', esc(e.catatan.slice(4).trim()));

  var hk = '<div class="card pad"><div class="meta">Laba kotor</div><div class="big ' + cls(r.labaKotor) + '">' + rp(r.labaKotor) + '</div>' +
    '<div class="meta" style="margin-bottom:8px">Setelah alokasi Jepreto + penyusutan: <b class="' + cls(r.labaBersih) + '">' + rp(r.labaBersih) + '</b></div><table>' +
    '<tr><td>Pemasukan</td><td class="r">' + rp(r.masuk) + '</td></tr>' +
    '<tr><td>Biaya langsung</td><td class="r">−' + rp(r.keluar) + '</td></tr>' +
    '<tr><td>Bahan · ' + r.tercetak + ' lbr × ' + rp(r.bl) + '</td><td class="r">−' + rp(r.bahan) + '</td></tr>' +
    '<tr><td>Alokasi per event</td><td class="r">−' + rp(r.alokasi) + '</td></tr></table>';
  hk += '</div>';
  var tg = tagihan(e, r);
  if (tg) {
    var pctBayar = Math.min(100, Math.round(tg.dibayar / tg.kontrak * 100)), pctDp = Math.round(tg.dp / tg.kontrak * 100);
    var tahapBaris = function (label, nominal, lunas, jatuh) {
      return '<tr><td>' + label + (jatuh ? ' <span class="meta">· ' + tgl(jatuh) + '</span>' : '') + '</td><td class="r">' + rp(nominal) + ' ' + (lunas ? '<span class="pill p-ok">Lunas</span>' : '<span class="pill">Belum</span>') + '</td></tr>';
    };
    hk += '<div class="card pad" style="margin-top:8px"><div class="meta">Pembayaran klien</div>' +
      '<div style="font-weight:700;margin:2px 0 10px">' + rp(tg.dibayar) + ' dari ' + rp(tg.kontrak) + '</div>' +
      '<div style="position:relative;height:10px;border-radius:10px;background:var(--soft);overflow:hidden"><div style="height:100%;width:' + pctBayar + '%;background:' + (tg.kurang ? 'var(--accent)' : 'var(--ok)') + ';border-radius:10px"></div>' +
      (tg.dp && tg.dp < tg.kontrak ? '<div style="position:absolute;top:0;bottom:0;left:' + pctDp + '%;width:2px;background:var(--card)"></div>' : '') + '</div><table style="margin-top:10px">' +
      (tg.dp ? tahapBaris('DP', tg.dp, tg.dibayar >= tg.dp, e.jatuh_tempo_dp) : '') +
      tahapBaris(tg.dp ? 'Pelunasan' : 'Pembayaran penuh', tg.kontrak - tg.dp, tg.dibayar >= tg.kontrak, e.jatuh_tempo_pelunasan || e.tanggal) + '</table>' +
      (tg.kurang ? '<div class="meta ' + (tg.sisaHari !== null && tg.sisaHari < 0 ? 'neg' : '') + '" style="margin:8px 0 10px">Tagih ' + (tg.tahap === 'DP' ? 'DP' : 'pelunasan') + ' <b>' + rp(tg.kurang) + '</b> · ' + teksJatuhTempo(tg) + '</div>' +
        '<button class="ubah btn sm" onclick="formKas(null,\'' + e.id_event + '\',{jenis:\'Masuk\',kategori:\'DP / Pelunasan Kontrak\',nominal:' + tg.kurang + ',keterangan:\'' + (tg.tahap === 'DP' ? 'DP' : 'Pelunasan') + ' ' + esc(String(e.nama_event).replace(/['\\]/g, '')) + '\'})">+ Catat pembayaran</button>' : '') + '</div>';
  }
  if (openBooth && (r.bepLapangan !== null || (r.bepKs && 'ABCD'.indexOf(r.bepKs) >= 0 && r.untungLembar > 0))) hk += htmlTitikImpas(r, lap ? r.lembarTerjual : 0, e);
  h += '<div class="cols"><div class="col">' + sec('Keuangan', hk);
  if (skemaKs(e)) h += sec('Kerja sama panitia', htmlKsEvent(e));
  var hv = htmlVoucherEvent(e);
  if (hv) h += sec('Voucher ' + esc(e.voucher_mitra || 'mitra'), hv);

  if (lap) {
    var st = lap.status_laporan;
    var lp = '<div class="card pad">' + (st || lap.dikirim_oleh ? '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">' + pillLaporan(lap) + '<span class="meta">' +
        [lap.dikirim_oleh ? 'dikirim ' + esc(lap.dikirim_oleh) + ' · ' + esc(lap.dikirim_pada) : '', st === 'Disetujui' ? 'disetujui ' + esc(lap.disetujui_oleh) + ' · ' + esc(lap.disetujui_pada) : ''].filter(Boolean).join(' · ') + '</span></div>' : '') +
      '<table>' +
      (lap.jam_setup_mulai || lap.jam_setup_selesai ? '<tr><td>Jam setup</td><td class="r">' + esc(lap.jam_setup_mulai || '—') + '–' + esc(lap.jam_setup_selesai || '—') + '</td></tr>' : '') +
      '<tr><td>Jam aktual</td><td class="r">' + esc(lap.jam_buka_aktual || '—') + '–' + esc(lap.jam_tutup_aktual || '—') + '</td></tr>' +
      '<tr><td>Transaksi</td><td class="r">' + num(lap.jumlah_transaksi) + '</td></tr>' +
      (lap.powerstation_awal !== '' && lap.powerstation_awal != null ? '<tr><td>Powerstation awal → akhir</td><td class="r">' + Math.round(num(lap.powerstation_awal) * 100) + '% → ' + (lap.powerstation_akhir !== '' && lap.powerstation_akhir != null ? Math.round(num(lap.powerstation_akhir) * 100) + '%' : '—') + '</td></tr>' : '') +
      (num(lap.softfile_gagal) ? '<tr><td>Softfile gagal terunggah</td><td class="r neg">' + num(lap.softfile_gagal) + '</td></tr>' : '') +
      (num(lap.cetak_ulang_voucher) ? '<tr><td>Cetak ulang voucher · lembar gagal</td><td class="r' + (num(lap.cetak_ulang_voucher) > num(lap.lembar_gagal) ? ' neg' : '') + '">' + num(lap.cetak_ulang_voucher) + ' · ' + num(lap.lembar_gagal) + '</td></tr>' : '') +
      '<tr><td>Sesi berbayar · Lembar/strip tambahan · Grad Book</td><td class="r">' + r.sesiTerjual + ' · ' + r.lembarTambahan + ' · ' + num(lap.grad_book_terjual) + (r.sesiVoucher ? ' <span class="meta">(+' + r.sesiVoucher + ' voucher)</span>' : '') + '</td></tr>' +
      '<tr><td>Tercetak (counter)</td><td class="r">' + r.tercetak + '</td></tr>' +
      '<tr><td>Terjual + uji + gagal</td><td class="r">' + r.lembarTerjual + ' + ' + num(lap.lembar_uji_bonus) + ' + ' + num(lap.lembar_gagal) + '</td></tr>' +
      '<tr class="total"><td>Selisih lembar</td><td class="r ' + (r.selisihLembar ? 'neg' : 'pos') + '">' + (r.selisihLembar ? r.selisihLembar + ' · periksa' : 'Cocok') + '</td></tr>' +
      (r.voucherMitra ? '<tr><td>Voucher ' + esc(e.voucher_mitra || 'mitra') + ' ditukar · potongan</td><td class="r">' + r.voucherMitra + ' · −' + rp(r.potonganVoucher) + '</td></tr>' : '') +
      '<tr><td>Omzet menurut laporan</td><td class="r">' + rp(r.omzet) + '</td></tr>' +
      '<tr><td>Uang diterima</td><td class="r">' + rp(r.diterima) + '</td></tr>' +
      '<tr class="total"><td>Selisih kas</td><td class="r ' + (r.selisihKas ? 'neg' : 'pos') + '">' + (r.selisihKas ? rp(r.selisihKas) : 'Cocok') + '</td></tr></table>';
    if (lap.rekomendasi) lp += '<div class="meta" style="margin-top:10px"><b>Rekomendasi</b><br>' + esc(lap.rekomendasi) + '</div>';
    if (lap.kendala) lp += '<div class="meta" style="margin-top:8px"><b>Kendala</b><br>' + esc(lap.kendala) + '</div>';
    lp += st === 'Disetujui' ? '<div class="btns"><button class="ubah btn sm ghost" onclick="batalSetujuiUI(\'' + e.id_event + '\',this)">Batalkan persetujuan</button></div>' :
      '<div class="meta ubah" style="margin-top:10px">Sebelum menyetujui: cocokkan jumlah sesi & pemakaian voucher cetak ulang dengan Jepreto.</div>' +
      '<div class="btns"><button class="ubah btn sm" onclick="setujuiLaporanUI(\'' + e.id_event + '\',this)">Setujui laporan' + (e.status === 'Terkonfirmasi' ? ' & tutup event' : '') + '</button></div>';
    lp += '</div>';
    lp += '<div class="card pad" style="margin-top:8px"><div class="meta" style="margin-bottom:8px">Foto bukti</div><div id="foto_bukti">' + htmlFotoBukti(lap) + '</div></div>';
    if (num(lap.cetak_ulang_voucher) > num(lap.lembar_gagal)) lp += '<div style="margin-top:8px">' + notice('bad', 'Cetak ulang pakai voucher (' + num(lap.cetak_ulang_voucher) + ') lebih banyak dari lembar gagal (' + num(lap.lembar_gagal) + '). Setiap cetak ulang harus punya satu lembar gagal — tanyakan ke tim.') + '</div>';
    if (Math.abs(r.omzet - r.masuk) > 0) lp += '<div style="margin-top:8px">' + notice('', 'Omzet laporan ' + rp(r.omzet) + ' ≠ pemasukan di Kas ' + rp(r.masuk) + '. Pastikan penjualan sudah dicatat.') + '</div>';
    h += sec('Laporan produksi', lp);
  }
  var rabBaris = [['Penyusutan', r.rab.penyusutan, r.realisasi.penyusutan], ['Langganan Jepreto', r.rab.jepreto, r.realisasi.jepreto],
    ['Fee crew', r.rab.feeCrew, r.realisasi.feeCrew], ['Transport', r.rab.transport, r.realisasi.transport], ['Konsumsi', r.rab.konsumsi, r.realisasi.konsumsi]];
  if (rabBaris.some(function (x) { return x[1]; })) {
    var rabTotal = 0, realTotal = 0;
    var rb = '<div class="card pad"><table><tr><td></td><td class="r" style="font-weight:600">RAB</td><td class="r" style="font-weight:600">Realisasi</td><td class="r" style="font-weight:600">Selisih</td></tr>' +
      rabBaris.map(function (x) {
        rabTotal += x[1]; realTotal += x[2];
        var s = x[2] - x[1];
        return '<tr><td>' + x[0] + '</td><td class="r">' + rp(x[1]) + '</td><td class="r">' + rp(x[2]) + '</td><td class="r ' + (s > 0 ? 'neg' : s < 0 ? 'pos' : '') + '">' + (s ? rp(s) : '—') + '</td></tr>';
      }).join('') +
      '<tr class="total"><td>Total</td><td class="r">' + rp(rabTotal) + '</td><td class="r">' + rp(realTotal) + '</td><td class="r ' + (realTotal > rabTotal ? 'neg' : realTotal < rabTotal ? 'pos' : '') + '">' + (realTotal !== rabTotal ? rp(realTotal - rabTotal) : '—') + '</td></tr></table></div>';
    h += sec('RAB vs Realisasi', rb + '<div class="meta" style="margin-top:8px">' + (lap ? 'Penyusutan & Jepreto terkunci sesuai kondisi Inventaris saat laporan pertama kali disimpan.' : 'Penyusutan & Jepreto masih perkiraan langsung dari Inventaris — terkunci setelah laporan diisi.') + '</div>');
  }
  h += '</div><div class="col">';
  var tugas = D.tugas.filter(function (t) { return t.id_event === e.id_event; });
  var totalFee = sum(tugas, function (t) { return t.fee; }), belumFee = tugas.filter(function (t) { return !feeLunas(t); });
  h += sec('Crew bertugas', '<div class="card">' + (tugas.length ? tugas.map(function (t) {
    var lunas = feeLunas(t), nm = namaCrew(t.id_crew), bt = e.status === 'Batal' ? [] : bentrokCrew(t.id_crew, e);
    return item({lead: '<div class="av">' + inisial(nm) + '</div>', t: esc(nm) + pillTugas(t.peran) + (bt.length ? ' <span class="pill p-bad">Bentrok</span>' : ''),
      s: (bt.length ? '<span class="neg">Juga di ' + bt.map(function (x) { return esc(x.nama_event); }).join(', ') + '</span><br>' : '') + 'Fee ' + rp(t.fee) + (t.catatan ? ' · ' + esc(t.catatan) : ''),
      end: lunas ? '<span class="pill p-ok">Dibayar</span>' : '<button class="ubah btn sm" onclick="event.stopPropagation();formBayarFee([\'' + t.id + '\'])">Bayar</button>',
      on: "formTugas('" + t.id + "')"});
