<script>
// Posetive — Lainnya: inventaris, HPP, Google Calendar, otomatis, laporan bulanan.
// ---------------------------------------------------------------- lainnya: laporan, otomatis
var OTO = null, LAP = {bulan: '', catatan: ''};
function vInventaris() {

    .slice().sort(function (a, b) { return String(a.nama).localeCompare(String(b.nama)); });

  var target = targetEventBulan();
  h += '<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="k">Nilai aset (' + aset.length + ')</div><div class="v">' + rpSingkat(sum(aset, function (x) { return x.nilai_beli; })) + '</div></div>' +
    '<div class="stat"><div class="k">Penyusutan/bulan</div><div class="v">' + rpSingkat(totalPenyusutanBulanan()) + '</div></div>' +
    '<div class="stat"><div class="k">Alokasi/event</div><div class="v">' + rpSingkat(totalPenyusutanBulanan() / target) + '</div></div></div>';
  h += '<div class="card pad" style="margin-bottom:10px"><div class="bar" style="margin:0;gap:10px"><label for="inv_target" style="font-weight:600">Target event per bulan</label>' +
    '<div style="display:flex;gap:8px;align-items:center"><input id="inv_target" type="number" inputmode="numeric" min="1" step="1" value="' + target + '" style="width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:center">' +
    '<button class="ubah btn sm" onclick="simpanTargetEvent(this)">Simpan</button></div></div>' +
    '<div class="meta" style="margin-top:8px">Alokasi per event = ' + rp(totalPenyusutanBulanan()) + ' ÷ ' + target + ' event = <b>' + rp(totalPenyusutanBulanan() / target) + '</b>. Dipakai untuk RAB event baru, kalkulator skema, dan event yang belum dilaporkan; event yang sudah ada laporannya tetap terkunci.</div></div>';
  h += '<div class="meta" style="margin-bottom:14px">Dihitung dari barang kategori Aset, milik Posetive, harga ≥ ' + rp(Pd('PENYUSUTAN_HARGA_MIN', 250000)) + ' (atur di PENGATURAN), dan umur manfaat terisi.</div>';
  if (butuhUmur.length) h += notice('', '<b>' + butuhUmur.length + ' aset</b> di atas harga minimal belum diisi umur manfaat, belum ikut dihitung penyusutan: ' + butuhUmur.map(function (x) { return esc(x.nama); }).join(', ') + '.');
  h += '<div class="chips" style="margin-bottom:14px">' + [['', 'Semua'], ['Aset', 'Aset'], ['Barang Habis Pakai', 'Habis Pakai']].map(function (c) {
    return '<button class="chip ' + (c[0] === f ? 'on' : '') + '" onclick="FILTER.inventaris=\'' + c[0] + '\';tampil(\'inventaris\')">' + c[1] + '</button>';
  }).join('') + '</div>';
  h += '<div class="card">' + (list.length ? list.map(function (x) {
    var p = itemPenyusutan(x), pinjam = x.pemilik && x.pemilik !== 'Posetive';
    var sub = esc(x.kategori || '—') + (x.jumlah ? ' · ' + x.jumlah + ' ' + esc(x.satuan || '') : '') + (pinjam ? ' · pinjaman ' + esc(x.pemilik) : '');
    var end = x.nilai_beli ? rp(x.nilai_beli) : '';
    if (p.umur) end += '<div class="s">' + (p.aktif ? rp(p.bulanan) + '/bln · ' + rp(p.bulanan / target) + '/event' : 'lunas susut') + '</div><div class="s">buku ' + rp(p.nilaiBuku) + '</div>';
    return item({t: esc(x.nama) + (x.kondisi && x.kondisi !== 'Baik' ? ' <span class="pill p-warn">' + esc(x.kondisi) + '</span>' : ''), s: sub, end: end, on: "formInventaris('" + x.id_alat + "')"});
  }).join('') : '<div class="empty">Belum ada barang.</div>') + '</div>';
  return h;
}
// ---- HPP & harga jual
/** Rincian HPP dari pengaturan p (fungsi kunci → angka); total lembar sama dengan biayaLembar(). */
function rincianHpp(p) {
  var kertas = p('HARGA_KERTAS') / (p('ISI_KERTAS') || 1), tinta = p('HARGA_TINTA') / (p('KAPASITAS_TINTA') || 1);
  var sub = kertas + tinta, cad = sub * p('CADANGAN_GAGAL'), lembar = sub + cad;
  return {kertas: kertas, tinta: tinta, sub: sub, cad: cad, lembar: lembar, buku: p('BIAYA_BUKU'),
    produk: [['Foto 4R (1 sesi)', p('HARGA_4R'), lembar], ['Lembar / strip tambahan', p('HARGA_STRIP'), lembar],
      ['Graduation Book + 1 foto 4R', p('HARGA_BUKU'), p('BIAYA_BUKU') + lembar]]};
}
function tabelMargin(produk) {
  return '<table><tr><td></td><td class="r" style="font-weight:600">Jual</td><td class="r" style="font-weight:600">HPP</td><td class="r" style="font-weight:600">Margin</td></tr>' +
    produk.map(function (x) {
      var m = x[1] - x[2];
      return '<tr><td>' + x[0] + '</td><td class="r">' + (x[1] ? rp(x[1]) : '—') + '</td><td class="r">' + rp(x[2]) + '</td><td class="r ' + (x[1] ? cls(m) : '') + '">' +
        (x[1] ? rp(m) + '<div class="meta">' + Math.round(m / x[1] * 100) + '%</div>' : '<span class="meta">belum diisi</span>') + '</td></tr>';
    }).join('') + '</table>';
}
function vHpp() {
  var r = rincianHpp(P), m4 = P('HARGA_4R') - r.lembar;
  var h = '<button class="back" onclick="tampil(\'lainnya\')">‹ Lainnya</button><div class="bar"><div class="pagetitle" style="margin:0">HPP & harga jual</div><button class="ubah btn sm" onclick="formHpp()">Ubah angka</button></div>';
  h += '<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="k">HPP / lembar</div><div class="v">' + rp(r.lembar) + '</div></div>' +
    '<div class="stat"><div class="k">HPP Grad Book</div><div class="v">' + rp(r.buku + r.lembar) + '</div></div>' +
    '<div class="stat"><div class="k">Margin 4R</div><div class="v ' + cls(m4) + '">' + (P('HARGA_4R') ? Math.round(m4 / P('HARGA_4R') * 100) + '%' : '—') + '</div></div></div>';
  h += '<div class="cols"><div class="col">';
  h += sec('Rincian HPP per lembar', '<div class="card pad"><table>' +
    '<tr><td>Kertas<div class="meta">' + rp(P('HARGA_KERTAS')) + ' ÷ ' + P('ISI_KERTAS') + ' lembar</div></td><td class="r">' + rp(r.kertas) + '</td></tr>' +
    '<tr><td>Tinta<div class="meta">' + rp(P('HARGA_TINTA')) + ' ÷ ' + P('KAPASITAS_TINTA') + ' lembar</div></td><td class="r">' + rp(r.tinta) + '</td></tr>' +
    '<tr><td>Cadangan cetak gagal<div class="meta">' + Math.round(P('CADANGAN_GAGAL') * 1000) / 10 + '% × ' + rp(r.sub) + '</div></td><td class="r">' + rp(r.cad) + '</td></tr>' +
    '<tr class="total"><td>HPP per lembar cetak</td><td class="r">' + rp(r.lembar) + '</td></tr>' +
    '<tr><td>Graduation Book<div class="meta">biaya cetak buku, belum termasuk foto</div></td><td class="r">' + rp(r.buku) + '</td></tr></table></div>' +
    '<div class="meta" style="margin-top:8px">Kapasitas tinta paling berpengaruh ke HPP. Perbarui dengan data nyata setelah satu set tinta habis (jumlah lembar tercetak sejak isi ulang).</div>');
  h += '</div><div class="col">';
  h += sec('Margin per produk', '<div class="card pad">' + tabelMargin(r.produk) + '</div>' +
    '<div class="meta" style="margin-top:8px">Berlaku untuk kalkulator skema, RAB, dan event yang belum dilaporkan. Event yang sudah ada laporannya tetap memakai HPP saat laporan disimpan.</div>');
  return h + '</div></div>';
}
var F_HPP = [
  {g: 'Bahan cetak'},
  {n: 'HARGA_KERTAS', l: 'Harga kertas 4R per pack (Rp)', t: 'num', wajib: 1}, {n: 'ISI_KERTAS', l: 'Isi per pack (lembar)', t: 'num', wajib: 1},
  {n: 'HARGA_TINTA', l: 'Harga tinta per set (Rp)', t: 'num', wajib: 1}, {n: 'KAPASITAS_TINTA', l: 'Kapasitas tinta per set (lembar)', t: 'num', wajib: 1},
  {n: 'CADANGAN_GAGAL', l: 'Cadangan cetak gagal (%)', t: 'pct', wajib: 1}, {n: 'BIAYA_BUKU', l: 'Biaya cetak Graduation Book (Rp/buku)', t: 'num', wajib: 1},
  {g: 'Harga jual'},
  {n: 'HARGA_4R', l: 'Foto 4R per sesi (Rp)', t: 'num', wajib: 1}, {n: 'HARGA_STRIP', l: 'Lembar / strip tambahan (Rp/lembar)', t: 'num', wajib: 1},
  {n: 'HARGA_BUKU', l: 'Graduation Book + 1 foto (Rp)', t: 'num', wajib: 1}
];
function formHpp() {
  var rec = {};
  F_HPP.forEach(function (f) { if (f.n) rec[f.n] = P(f.n); });
  bukaForm('Ubah HPP & harga jual', F_HPP, rec, function (r) {
    var ubah = {};
    F_HPP.forEach(function (f) { if (f.n && num(r[f.n]) !== P(f.n)) ubah[f.n] = r[f.n]; });
    return Object.keys(ubah).length ? panggil('simpanPengaturanBanyak', ubah) : Promise.resolve();
  }, '<div class="meta">Tersimpan ke tab PENGATURAN. Laporan event lama dikunci dulu dengan HPP sebelumnya, jadi labanya tidak ikut berubah.</div>', function (r) {
    var el = document.getElementById('preview'); if (!el) return;
    var x = rincianHpp(function (k) { return num(r[k]); });
    el.innerHTML = '<div class="card pad" style="background:var(--soft);box-shadow:none"><div class="meta">Pratinjau</div><div style="font-weight:700;margin:2px 0 8px">HPP ' + rp(x.lembar) + '/lembar' +
      (x.lembar !== biayaLembar() ? ' <span class="meta">(sekarang ' + rp(biayaLembar()) + ')</span>' : '') + '</div>' + tabelMargin(x.produk) + '</div>';
  });
}
function simpanTargetEvent(btn) {
  var n = Math.round(Number(document.getElementById('inv_target').value));
  if (!(n >= 1)) { toast('Target minimal 1 event per bulan'); return; }
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  panggil('simpanPengaturan', 'EVENT_BULAN', n).then(function () { toast('Target ' + n + ' event/bulan tersimpan'); return muat(true); })
    .catch(function (e) { btn.disabled = false; btn.textContent = 'Simpan'; toast('Gagal: ' + (e && e.message || e)); });
}
var F_INVENTARIS = [
  {n: 'nama', l: 'Nama barang', wajib: 1},
  {n: 'kategori', l: 'Kategori', t: 'sel', o: pil('Kategori Alat'), def: 'Aset', wajib: 1},
  {n: 'pemilik', l: 'Pemilik', t: 'sel', o: pil('Pemilik'), def: 'Posetive'},
  {n: 'jumlah', l: 'Jumlah', t: 'num', def: 1}, {n: 'satuan', l: 'Satuan (unit, pcs, pack, ...)'},
  {n: 'kondisi', l: 'Kondisi', t: 'sel', o: pil('Kondisi'), def: 'Baik'},
  {n: 'lokasi', l: 'Lokasi'}, {n: 'tanggal_masuk', l: 'Tanggal masuk', t: 'date'},
  {g: 'Penyusutan'},
  {n: 'nilai_beli', l: 'Nilai beli (Rp)', t: 'num'},
  {n: 'umur_manfaat_bulan', l: 'Umur manfaat (bulan) — kosongkan bila tidak dihitung penyusutannya', t: 'num'},
  {n: 'catatan', l: 'Catatan', t: 'area'}
];
function formInventaris(id) {
  var x = id ? cari(D.inventaris, 'id_alat', id) : {};
  var extra = id ? '<button class="ubah btn danger" type="button" onclick="hapus(\'INVENTARIS\',\'' + id + '\')">Hapus</button>' : '';
  bukaForm(id ? (x.nama || id) : 'Barang baru', F_INVENTARIS, x, function (r) { return panggil('saveRecord', 'INVENTARIS', r); }, extra);
}
function vLainnya() {
  if (D.serverLama) return '<div class="pagetitle">Lainnya</div>' + notice('bad', '<b>Code.gs di Apps Script masih versi lama.</b> Tempel ulang Code.gs terbaru lalu Terapkan → Versi baru.');
  var bulanList = Array.from(new Set(D.event.map(function (e) { return String(e.tanggal).slice(0, 7); }).concat(D.kas.map(function (k) { return String(k.tanggal).slice(0, 7); })).concat([D.hariIni.slice(0, 7)])))
    .filter(function (b) { return /^\d{4}-\d{2}$/.test(b); }).sort().reverse();
  if (!LAP.bulan) LAP.bulan = D.hariIni.slice(0, 7);
  var h = '<div class="pagetitle">Lainnya</div>';
  h += sec('Akun saya', kartuAkun());
  if (bisaUbah()) h += sec('Pengguna', '<div class="card pad"><div class="meta" style="margin-bottom:10px">Akun untuk masuk ke aplikasi: admin, pemantau (lihat saja), dan crew. Reset PIN bila ada yang lupa.</div><button class="btn sm" onclick="PENGGUNA=null;tampil(\'pengguna\')">Kelola pengguna</button></div>');
  h += sec('Laporan bulanan untuk owner', '<div class="card pad"><div class="meta" style="margin-bottom:10px">Ringkasan satu halaman: event, keuangan, piutang, pipeline, stok, alat, dan keputusan penting. Bisa disimpan sebagai PDF di Drive.</div>' +
    '<div class="bar" style="margin:0"><select class="plain" id="lap_bulan">' + bulanList.map(function (b) { return '<option value="' + b + '"' + (b === LAP.bulan ? ' selected' : '') + '>' + BLN[Number(b.slice(5)) - 1] + ' ' + b.slice(0, 4) + '</option>'; }).join('') + '</select>' +
    '<button class="btn sm" onclick="LAP.bulan=document.getElementById(\'lap_bulan\').value;tampil(\'laporan\')">Buka laporan</button></div></div>');
  h += sec('Crew', '<div class="card pad"><div class="meta" style="margin-bottom:10px">Data tim (domisili, kendaraan, rekening, masa kontrak) dan fee yang belum dibayar.</div><button class="btn sm" onclick="tampil(\'crew\')">Kelola crew</button></div>');
  h += sec('HPP & harga jual', '<div class="card pad"><div class="meta" style="margin-bottom:10px">HPP per lembar ' + rp(biayaLembar()) + ' · Graduation Book ' + rp(P('BIAYA_BUKU') + biayaLembar()) + '. Rincian kertas, tinta, cadangan gagal, dan margin tiap produk.</div><button class="btn sm" onclick="tampil(\'hpp\')">Lihat & ubah HPP</button></div>');
  h += sec('Inventaris','<div class="card pad"><div class="meta" style="margin-bottom:10px">Alat & aset milik atau pinjaman ke Posetive, beserta penyusutannya (' + rpSingkat(totalPenyusutanBulanan()) + '/bulan).</div><button class="btn sm" onclick="tampil(\'inventaris\')">Kelola inventaris</button></div>');
  h += sec('Google Calendar', '<div class="card pad"><div class="meta" style="margin-bottom:10px">' + (D.kalender ?
      '<span class="pill p-ok">Terhubung</span> Event otomatis masuk ke kalender <b>Posetive Photobooth</b> di Google Calendar setiap kali disimpan (jam, lokasi, klien, crew). Event batal dihapus dari kalender.' :
      'Sambungkan supaya setiap event otomatis masuk ke Google Calendar (kalender baru "Posetive Photobooth") dan muncul sebagai notifikasi di HP.') + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ubah btn sm" onclick="sinkronKalenderUI(this)">' + (D.kalender ? 'Sinkronkan ulang semua' : 'Hubungkan & sinkronkan') + '</button>' +
    (D.kalender ? '<button class="ubah btn sm ghost" onclick="putusKalenderUI(this)">Putuskan</button>' : '') + '</div></div>');
  h += sec('Otomatis', '<div class="card" id="oto">' + (OTO ? isiOto() : '<div class="empty">Memeriksa…</div>') + '</div><div class="meta" style="margin-top:8px">Pertama kali dinyalakan, Google akan meminta izin tambahan (Gmail & Drive). Pilih akun Anda → Lanjutan → Izinkan.</div>');
  h += sec('Info usaha untuk invoice', '<div class="card pad"><table>' +
    '<tr><td>Nama usaha</td><td class="r">' + esc(D.pengaturan.NAMA_USAHA || '—') + '</td></tr>' +
    '<tr><td>Kontak</td><td class="r">' + esc(D.pengaturan.KONTAK_USAHA || '— belum diisi') + '</td></tr>' +
    '<tr><td>Rekening</td><td class="r">' + esc(D.pengaturan.REKENING || '— belum diisi') + '</td></tr></table>' +
    '<div class="meta" style="margin-top:8px">Ubah di tab PENGATURAN (NAMA_USAHA, KONTAK_USAHA, REKENING).</div></div>');
  if (!OTO) panggil('statusOtomatis').then(function (o) { OTO = o; var el = document.getElementById('oto'); if (el) el.innerHTML = isiOto(); })
    .catch(function (e) { var el = document.getElementById('oto'); if (el) el.innerHTML = '<div class="empty">Gagal memeriksa: ' + esc(e && e.message || e) + '</div>'; });
  return h;
}
function isiOto() {
  function baris(nama, judul, ket, tombol) {
    var on = OTO[nama];
    return '<div class="it" style="display:block"><div class="t">' + judul + ' ' + (on ? '<span class="pill p-ok">Aktif</span>' : '<span class="pill">Mati</span>') + '</div>' +
      '<div class="meta" style="margin:2px 0 10px">' + ket + '</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + tombol +
      '<button class="ubah btn sm ' + (on ? 'ghost' : '') + '" onclick="aturOto(\'' + nama + '\',' + !on + ',this)">' + (on ? 'Matikan' : 'Nyalakan') + '</button></div></div>';
  }
  return baris('pengingat', 'Pengingat email', 'Tiap pagi 07.00 ke ' + esc(OTO.email) + ' — hanya bila ada event H-1, follow-up, tagihan klien jatuh tempo, fee crew belum dibayar, alat belum kembali, atau stok menipis.', '<button class="ubah btn sm ghost" onclick="tesPengingat(this)">Kirim tes</button>') +
    baris('backup', 'Backup mingguan', 'Tiap Minggu 21.00, salinan file master ke folder "Posetive - Backup" (8 terakhir disimpan).', '<button class="ubah btn sm ghost" onclick="backupKini(this)">Backup sekarang</button>');
}
function aturOto(nama, aktif, btn) {

    .catch(function (e) { btn.disabled = false; toast('Gagal: ' + (e && e.message || e)); });
}

    .catch(function (e) {
      btn.disabled = false; btn.textContent = 'Coba lagi';

function putusKalenderUI(btn) {

    .catch(function (e) { btn.disabled = false; toast('Gagal: ' + (e && e.message || e)); });

function tesPengingat(btn) { btn.disabled = true; panggil('kirimPengingatTes').then(function (em) { btn.disabled = false; toast('Email tes dikirim ke ' + em); }).catch(function (e) { btn.disabled = false; toast('Gagal: ' + (e && e.message || e)); }); }
function backupKini(btn) { btn.disabled = true; btn.textContent = 'Menyalin…'; panggil('backupSekarang').then(function (url) { btn.disabled = false; btn.textContent = 'Backup sekarang'; bukaLink(url, 'Backup selesai'); }).catch(function (e) { btn.disabled = false; btn.textContent = 'Backup sekarang'; toast('Gagal: ' + (e && e.message || e)); }); }
function bukaLink(url, judul) {
  document.getElementById('panel').innerHTML = '<div class="grab"></div><h2>' + esc(judul) + '</h2><p class="meta">File tersimpan di Google Drive.</p><div class="btns"><a class="btn" style="text-decoration:none;flex:1;text-align:center" href="' + esc(url) + '" target="_blank" rel="noopener">Buka file</a><button class="btn ghost" onclick="tutupForm()">Tutup</button></div>';
  document.getElementById('sheet').classList.add('open');
}

// ---- laporan bulanan
function dataLaporan(bulan) {
  var inM = function (t) { return String(t).slice(0, 7) === bulan; };
  var kas = D.kas.filter(function (k) { return inM(k.tanggal); });
  var r = {bulan: bulan};
  r.masuk = sum(kas.filter(bukanSetoran), function (k) { return k.nominal; });
  r.biaya = sum(kas.filter(function (k) { return k.jenis === 'Keluar' && k.kategori !== 'Pengadaan Barang'; }), function (k) { return k.nominal; });
  r.alat = sum(kas.filter(function (k) { return k.jenis === 'Keluar' && k.kategori === 'Pengadaan Barang'; }), function (k) { return k.nominal; });
  r.setoran = sum(kas.filter(function (k) { return k.jenis === 'Masuk' && k.kategori === 'Setoran Owner'; }), function (k) { return k.nominal; });
  var akhir = bulan + '-31';
  r.saldo = sum(D.kas.filter(function (k) { return String(k.tanggal) <= akhir; }), function (k) { return k.jenis === 'Masuk' ? k.nominal : -num(k.nominal); });
  r.event = D.event.filter(function (e) { return inM(e.tanggal); }).sort(function (a, b) { return a.tanggal < b.tanggal ? -1 : 1; }).map(function (e) { return {e: e, h: hasilEvent(e)}; });
  r.selesai = r.event.filter(function (x) { return x.e.status === 'Selesai'; });
  r.labaKotor = sum(r.selesai, function (x) { return x.h.labaKotor; });
  r.piutang = D.event.map(function (e) { return {e: e, h: hasilEvent(e)}; }).filter(function (x) { return x.h.piutang > 0 && x.e.status !== 'Batal'; });
  r.prospekBaru = D.pipeline.filter(function (p) { return inM(p.tanggal_masuk); });
  r.deal = D.pipeline.filter(function (p) { return p.status === 'Deal' && inM(p.tanggal_masuk); });
  r.kalah = D.pipeline.filter(function (p) { return (p.status === 'Kalah' || p.status === 'Batal') && inM(p.tanggal_masuk); });
  r.aktif = D.pipeline.filter(aktif);
  r.keputusan = D.keputusan.filter(function (k) { return inM(k.tanggal); });
  r.alatMasalah = alatBelumKembali().map(function (a) { return a.nama_alat + ' (belum kembali, ' + a.id_event + ')'; })
    .concat(D.inventaris.filter(function (x) { return ['Perlu Perbaikan', 'Rusak', 'Hilang'].indexOf(x.kondisi) >= 0; }).map(function (x) { return x.nama + ' (' + x.kondisi.toLowerCase() + ')'; }));
  return r;
}
function htmlLaporan(bulan, catatan, cetak) {
  var r = dataLaporan(bulan), nm = BLN[Number(bulan.slice(5)) - 1] + ' ' + bulan.slice(0, 4);
  var tb = function (rows) { return '<table style="width:100%;border-collapse:collapse">' + rows.map(function (x) { return '<tr>' + x.map(function (c, i) { return '<td style="padding:5px 0;border-top:1px solid #e6e1da;vertical-align:top;' + (i ? 'text-align:right;white-space:nowrap;padding-left:10px;' : '') + '">' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>'; };
  var h3 = function (t) { return '<h3 style="font-size:13px;margin:18px 0 6px;color:#c84b31;text-transform:uppercase;letter-spacing:.05em">' + t + '</h3>'; };

  var h = '<div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#1c1a17">' +
    '<div style="font-size:20px;font-weight:bold">Laporan Bulanan — ' + esc(D.pengaturan.NAMA_USAHA || 'Posetive Photobooth') + '</div>' +
    '<div style="color:#7a736a">Periode ' + nm + ' · disusun ' + tgl(D.hariIni) + ' oleh ' + esc(D.pengaturan.NAMA_MANAJER || 'Garda') + '</div>';
  h += h3('Ringkasan') + tb([
    ['Event di bulan ini', r.event.length + ' (' + r.selesai.length + ' selesai)'],
    ['Pemasukan', rp(r.masuk)], ['Biaya operasional', rp(r.biaya)], ['<b>Hasil operasional</b>', '<b>' + rp(r.masuk - r.biaya) + '</b>'],
    ['Laba kotor event selesai (setelah bahan)', rp(r.labaKotor)], ['Belanja alat', rp(r.alat)], ['Dana dari owner', rp(r.setoran)], ['Saldo kas akhir bulan', rp(r.saldo)]]);
  h += h3('Event') + (r.event.length ? tb([['<b>Event</b>', '<b>Omzet</b>', '<b>Biaya</b>', '<b>Laba kotor</b>']].concat(r.event.map(function (x) {
    return [tgl(x.e.tanggal) + ' · ' + esc(x.e.nama_event) + ' <span style="color:#7a736a">(' + esc(x.e.model_pendapatan || '-') + ', ' + esc(x.e.status) + ')</span>', rp(x.h.masuk), rp(x.h.keluar + x.h.bahan), rp(x.h.labaKotor)];
  }))) : '<div>Tidak ada event.</div>');
  h += h3('Piutang (semua periode)') + (r.piutang.length ? tb(r.piutang.map(function (x) {
    var t = tagihan(x.e, x.h);
    return [esc(x.e.nama_event) + ' (' + tgl(x.e.tanggal) + ')' + (t ? ' <span style="color:#7a736a">— tahap ' + t.tahap + ', ' + teksJatuhTempo(t) + '</span>' : ''), rp(x.h.piutang)];
  })) : '<div>Tidak ada piutang.</div>');
  var fee = feeBelumDibayar(false);
  h += h3('Fee crew belum dibayar') + (fee.length ? tb(fee.map(function (t) { return [esc(namaCrew(t.id_crew)) + ' · ' + esc(namaEvent(t.id_event)), rp(t.fee)]; })) : '<div>Semua fee crew sudah dibayar.</div>');
  h += h3('Pipeline') + tb([['Prospek baru bulan ini', String(r.prospekBaru.length)], ['Jadi deal', String(r.deal.length)], ['Kalah / batal', String(r.kalah.length) + (r.kalah.length ? ' — ' + r.kalah.map(function (p) { return esc(p.alasan_kalah || 'alasan tidak diisi'); }).join(', ') : '')],
    ['Prospek aktif saat ini', r.aktif.length + (r.aktif.length ? ' (' + r.aktif.map(function (p) { return esc(p.nama_klien); }).join(', ') + ')' : '')]]);
  h += h3('Stok & alat') + tb([['Kertas 4R', k === null ? '-' : k + ' lembar'], ['Graduation Book', b === null ? '-' : b + ' buku'], ['Tinta (warna terendah)', t ? Math.round(t.level * 100) + '%' : '-'],
    ['Alat perlu perhatian', r.alatMasalah.length ? r.alatMasalah.map(esc).join('; ') : 'Tidak ada']]);
  h += h3('Keputusan penting') + (r.keputusan.length ? tb(r.keputusan.map(function (x) { return [tgl(x.tanggal) + ' · ' + esc(x.keputusan), esc(x.kill_criteria ? 'Batas mundur: ' + x.kill_criteria : '')]; })) : '<div>Tidak ada yang dicatat di LOG_KEPUTUSAN.</div>');
  if (catatan) h += h3('Catatan manajer') + '<div style="white-space:pre-wrap">' + esc(catatan) + '</div>';

function vLaporan() {

  h += '<div class="f"><label>Catatan untuk owner (ikut masuk PDF)</label><textarea id="lap_cat" oninput="LAP.catatan=this.value;document.getElementById(\'lap_isi\').innerHTML=htmlLaporan(LAP.bulan,LAP.catatan)">' + esc(LAP.catatan) + '</textarea></div>';

function simpanLaporanPdf(btn) {

    .catch(function (e) { btn.disabled = false; btn.textContent = 'Simpan PDF ke Drive'; toast('Gagal: ' + (e && e.message || e)); });
}
